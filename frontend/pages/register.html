<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link rel="stylesheet" href="../styles/register.css">
  </head>
  <body>
    <header>
      <img src="../imgs/logo.png" alt="">
    </header>
    <main>
        <div class="container">
            <div class="heading">Registre-se</div>
            <form action="" class="form">
                <p></p>
                <input required="" class="input" type="text" name="name" id="name-input" placeholder="Nome">
                <input required="" class="input" type="email" name="email" id="email-input" placeholder="E-mail">
                <input required="" class="input" type="password" name="password" id="password-input" placeholder="Senha">
                <input required="" class="input" type="date" name="dob" id="dob-input" placeholder="Data de Nascimento">
                <button class="register-button" id="register-button" type="button">Registrar-se</button>
            </form>
            <span class="login"><a href="../pages/login.html">Já tenho uma conta.</a></span>
        </div>
    </main>
    <script src="../script/register.js"></script>
  </body>
</html>

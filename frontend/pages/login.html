<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link rel="stylesheet" href="../styles/login.css" />
  </head>
  <body>
    <header>
      <img src="../imgs/logo.png" alt="" />
    </header>
    <main>
      <div class="container">
        <div class="heading">Logar-se</div>
        <form action="" class="form">
          <input
            required=""
            class="input"
            type="email"
            name="email"
            id="email-input"
            placeholder="E-mail"
          />
          <input
            required=""
            class="input"
            type="password"
            name="password"
            id="password-input"
            placeholder="Senha"
          />
          <button class="login-button" id="login-button" type="button">
            Entrar
          </button>
        </form>
        <span class="register"
          ><a href="../pages/register.html">Não tenho uma conta ainda.</a></span
        >
      </div>
    </main>
    <script src="../script/login.js"></script>
  </body>
</html>
